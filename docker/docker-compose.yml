services:
  postgres:
    image: postgres:16
    container_name: credit_risk_pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Kalici veri: container silinse bile tablolar kaybolmaz
      - pgdata:/var/lib/postgresql/data
      # Ham CSV'ler: container icinden COPY ile okuyabilmek icin salt-okunur baglaniyor
      - ../data/raw:/data/raw:ro
      # Tum SQL scriptleri: container icinden `psql -f /sql/...` ile calistirilir.
      # Not: Bilincli olarak /docker-entrypoint-initdb.d KULLANMIYORUZ, cunku o
      # klasor sadece veritabani ILK kez olusturulurken calisir. Semayi acikca
      # uygulamak, "neden calismadi?" surprizlerinden iyidir.
      - ../sql:/sql:ro
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
