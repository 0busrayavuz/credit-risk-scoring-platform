[pytest]
testpaths = tests
addopts = -q

# Testler iki gruba ayrilir:
#   isaretsiz  : birim testleri - saf mantik, hicbir dis bagimliligi yok.
#                Surekli entegrasyonda (CI) her itmede calisir.
#   veritabani : butunlesme testleri - calisan PostgreSQL, yuklenmis 58,5M
#                satirlik veri ve egitilmis modeller ister. Yerelde calisir,
#                CI'da atlanir (2,5 GB veriyi her itmede yuklemek pratik degil).
#
# CI'da:      pytest -m "not veritabani"
# Yerelde:    pytest              (hepsi)
markers =
    veritabani: PostgreSQL ve egitilmis model gerektiren butunlesme testi
