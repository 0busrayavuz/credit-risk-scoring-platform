name: testler

# Her itmede ve her pull request'te calisir.
#
# NE TEST EDILIR, NE EDILMEZ - ve neden:
#   Bu projenin butunlesme testleri 58,5 milyon satir yuklenmis bir PostgreSQL
#   ve egitilmis modeller ister. 2,5 GB'lik Kaggle verisini her itmede indirip
#   yuklemek pratik degildir (ve Kaggle kimlik dogrulamasi gerektirir).
#
#   Bu yuzden CI, dis bagimliligi olmayan BIRIM testlerini calistirir:
#   PSI hesabi, Gini/KS metrikleri ve korumali ozellik politikasi -
#   yani projenin matematiksel cekirdegi. Ayrica tum modullerin ice
#   aktarilabildigini dogrular; bu, bagimlilik kirilmalarini yakalar
#   (proje icinde sklearn/optbinning ve pandas/mlflow surum catismalari
#   yasandi, ikisi de bu kontrolle erken yakalanabilirdi).
#
#   Veritabani gerektiren testler yerelde calistirilir:  pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ortam degiskenleri
        # src/config.py acilista .env okur ve eksikse hata verir.
        # Baglanti KURULMAZ - yalnizca baglanti dizesi olusturulur -
        # bu yuzden ornek dosyadaki sahte degerler yeterlidir.
        run: cp .env.example .env

      - name: Moduller ice aktarilabiliyor mu
        run: |
          python -c "
          import importlib
          moduller = ['config', 'data', 'metrics', 'korumali_ozellikler',
                      'scorecard_secim', 'takip', 'psi_izleme', 'api']
          for m in moduller:
              importlib.import_module(f'src.{m}')
              print(f'  OK  src.{m}')
          "

      - name: Birim testleri
        run: pytest -m "not veritabani" -v
